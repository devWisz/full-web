<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="card">
    <h1>URL SHORTENER</h1>
    <p class="subtitle">Shorten your long URLs in seconds</p>

    <div class="input-box">
      <input type="text" placeholder="Paste your long URL here" class="inputUrl" />
      <button class="primaryBtn">Shorten</button>
    </div>

    <div class="result hidden" id="result"></div>

    <div class="actionBtns hidden">
      <button class="outlineBtn copyBtn">Copy</button>
      <button class="outlineBtn redirectBtn">Open</button>
    </div>

    <button class="historyBtn">History</button>
  </main>

  <section class="historyModal hidden">
    <div class="historyBox">
      <div class="historyHeader">
        <h3>Shortened URLs</h3>
        <button class="closeBtn">✕</button>
      </div>
      <ul class="historyList"></ul>
    </div>
  </section>

  <div class="toast hidden"></div>

  <footer class="footer">
    <p>Developed by <strong>Sarjak Khanal</strong></p>
    <div class="socials">
      <a href="https://github.com/devWisz" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/sarjak-khanal/" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://x.com/user_Sarjak_dev" target="_blank"><i class="fab fa-x-twitter"></i></a>
    </div>
  </footer>

</body>
</html>
